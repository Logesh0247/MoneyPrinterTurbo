<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      const STORAGE_KEY = "moneyprinterturbo.device-keys.v1";
      const DEFAULT_COOKIE = "mpt_session";

      function sendMessageToStreamlit(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data),
          "*"
        );
      }

      function setFrameHeight() {
        sendMessageToStreamlit("streamlit:setFrameHeight", { height: 0 });
      }

      function setComponentValue(value) {
        sendMessageToStreamlit("streamlit:setComponentValue", { value: value });
      }

      function readStore() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return null;
          }
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            return null;
          }
          return parsed;
        } catch (error) {
          return null;
        }
      }

      function writeStore(payload) {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
          return;
        }
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (error) {
          // Private mode and quota errors must not wipe a previous copy.
        }
      }

      function setSessionCookie(name, token, maxAge) {
        const cookieName = name || DEFAULT_COOKIE;
        const secure = window.location.protocol === "https:" ? "; Secure" : "";
        if (!token) {
          document.cookie =
            cookieName + "=; path=/; max-age=0; SameSite=Lax" + secure;
          return;
        }
        const age = Number(maxAge) > 0 ? Number(maxAge) : 7776000;
        document.cookie =
          cookieName +
          "=" +
          encodeURIComponent(token) +
          "; path=/; max-age=" +
          age +
          "; SameSite=Lax" +
          secure;
      }

      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") {
          return;
        }
        const args = data.args || {};
        if (args.payload_to_save) {
          writeStore(args.payload_to_save);
        }
        if (Object.prototype.hasOwnProperty.call(args, "session_token")) {
          setSessionCookie(
            args.cookie_name,
            args.session_token,
            args.session_max_age
          );
        }
        setComponentValue({ ready: true, payload: readStore() });
        setFrameHeight();
      });

      sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    </script>
  </body>
</html>
